name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SITE_ORIGIN: https://tvr.works
      VITE_SITE_INDEXING: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Verify public indexing artifact
        run: npm run test:browser -- --grep 'metadata match the indexing mode|static security headers'
        env:
          VITE_SITE_INDEXING: public
          CF_PAGES_BRANCH: main
